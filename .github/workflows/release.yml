name: Release

# Builds installers for every OS and attaches them to the GitHub release, together with the
# latest*.yml files the installed app reads to update itself. Called by the Release PR
# workflow after a release PR is merged; pushing a tag like v0.2.0 by hand works too.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag, like v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          # Blockmaps let the app download only the changed parts of an update.
          path: |
            dist/MosPolytech-Records-*
            dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          sed "s/{{VERSION}}/$TAG/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created by the Release PR workflow: keep its changelog under the download table.
            gh release view "$TAG" --json body --jq .body > changelog.md
            gh release upload "$TAG" installers/* --clobber
            if ! grep -q '^## Скачать' changelog.md; then
              printf '\n\n' >> notes.md
              cat changelog.md >> notes.md
              gh release edit "$TAG" --title "MosPolytech Records $TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" installers/* \
              --title "MosPolytech Records $TAG" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag
          fi
