version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      electron:
        patterns: ['electron', 'electron-builder', 'electron-vite']
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'lucide-react']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'globals']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types follow the Node line the app targets (engines: >=24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint has to support a new TypeScript major first.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
